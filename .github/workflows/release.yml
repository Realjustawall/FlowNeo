name: Publish FlowNeo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'release: v1.3.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build extension ZIP
        run: |
          zip -r FlowNeo-v1.3.0.zip \
            manifest.json app.js engine.js link.js stat.js \
            panel.html panel.css panel.js info.html assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo "Release v1.3.0 already exists."
          else
            gh release create v1.3.0 FlowNeo-v1.3.0.zip \
              --title "FlowNeo v1.3.0" \
              --notes-file RELEASE_NOTES.md \
              --target main
          fi
