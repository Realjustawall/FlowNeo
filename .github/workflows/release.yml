name: Publish FlowNeo Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "${{ contains(github.event.head_commit.message, 'release: v1.3.1') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.1 >/dev/null 2>&1; then
            echo "Release v1.3.1 already exists."
          else
            gh release create v1.3.1 \
              --title "FlowNeo v1.3.1" \
              --notes-file RELEASE_NOTES.md \
              --target main
          fi
